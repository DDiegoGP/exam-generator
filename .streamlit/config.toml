[server]
maxUploadSize = 50

[client]
# La navegación entre páginas se dibuja arriba (app_theme.render_topbar)
showSidebarNavigation = false
# Sin «Deploy»: solo el menú ⋮ (Settings → claro / oscuro)
toolbarMode = "viewer"

# ── Tema base (común a claro y oscuro) ────────────────────────────────────────
[theme]
font = "Figtree:https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
baseRadius = "0.55rem"
buttonRadius = "0.55rem"
showWidgetBorder = true
showSidebarBorder = true

# ── Bitácora claro ────────────────────────────────────────────────────────────
[theme.light]
primaryColor = "#1d4a94"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#ffffff"
textColor = "#1a2233"
linkColor = "#1d4a94"
borderColor = "#d5dbe5"
dataframeBorderColor = "#e4e8ef"
dataframeHeaderBackgroundColor = "#f5f7fa"
codeBackgroundColor = "#f5f7fa"

[theme.light.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#ffffff"

# ── Bitácora oscuro ───────────────────────────────────────────────────────────
[theme.dark]
primaryColor = "#4f80dd"
backgroundColor = "#18202d"
secondaryBackgroundColor = "#1d2635"
textColor = "#e6eaf2"
linkColor = "#8fb2f5"
borderColor = "#344052"
dataframeBorderColor = "#2a3443"
dataframeHeaderBackgroundColor = "#1d2635"
codeBackgroundColor = "#1d2635"

[theme.dark.sidebar]
backgroundColor = "#141a25"
secondaryBackgroundColor = "#18202d"

[browser]
gatherUsageStats = false
